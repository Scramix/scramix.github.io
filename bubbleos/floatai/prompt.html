<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Float AI</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    overflow: hidden;
    font-family: Tahoma, Verdana, "Segoe UI Emoji", sans-serif;
    background: linear-gradient(to bottom, #b8ecff, #e8fbff);
    color: #003366;
}

#bubbles {
    position: fixed;
    inset: 0;
    z-index: -1;
}

.bubble {
    position: absolute;
    bottom: -120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.45);
    border: 1px solid rgba(255,255,255,0.7);
    animation: float linear infinite;
}

@keyframes float {
    from { transform: translateY(0); }
    to { transform: translateY(-120vh); }
}

#wrapper {
    opacity: 0;
    animation: fadein 1.2s forwards;
}

@keyframes fadein {
    to { opacity: 1; }
}

.header {
    text-align: center;
    padding: 25px;
}

.logo {
    font-size: 50px;
    font-weight: bold;
}

.container {
    display: flex;
    max-width: 1100px;
    margin: auto;
    gap: 15px;
    padding: 10px;
}

.panel {
    background: rgba(255,255,255,0.75);
    border: 2px solid #7fdfff;
    border-radius: 18px;
    backdrop-filter: blur(4px);
}

#sidebar {
    width: 260px;
    padding: 10px;
    height: 70vh;
    overflow-y: auto;
}

.chatRow {
    display: flex;
    gap: 5px;
    margin-top: 5px;
}

.chatBtn {
    flex: 1;
    padding: 8px;
}

.menuBtn {
    width: 40px;
}

#main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 10px;
    height: 70vh;
}

#chatBox {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    background: rgba(255,255,255,0.5);
    border-radius: 12px;
}

.user { text-align: right; }
.assistant { text-align: left; }

#inputArea {
    display: flex;
    gap: 5px;
    margin-top: 10px;
}

#chatInput {
    flex: 1;
    padding: 10px;
}

button {
    border-radius: 12px;
    border: 2px solid #6dd6ff;
    background: linear-gradient(#fff, #dff8ff);
    cursor: pointer;
}

.statusbar {
    position: fixed;
    bottom: 0;
    width: 100%;
    padding: 6px;
    background: #dff8ff;
    border-top: 2px solid #6dd6ff;
}
</style>
</head>

<body>

<div id="bubbles"></div>

<div id="wrapper">

    <div class="header">
        <div class="logo">Float AI</div>
    </div>

    <div class="container">

        <div id="sidebar" class="panel">

            <div style="display:flex; gap:5px;">
                <button id="newChatBtn">+ New Chat</button>
                <button id="settingsBtn"></button>
            </div>

            <input id="chatSearch" placeholder="Search chats..." style="width:100%;margin-top:10px;">

            <div id="chatList"></div>
        </div>

        <div id="main" class="panel">

            <div id="chatBox"></div>

            <div id="inputArea">
                <input id="chatInput" placeholder="Type...">
                <button id="sendBtn">Send</button>
            </div>

        </div>

    </div>

</div>

<!-- Settings -->
<div id="settingsModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);">
    <div class="panel" style="width:300px;margin:120px auto;padding:15px;">
        <h3>Settings</h3>

        <label>Emoji Level</label>
        <select id="emojiLevelSelect" style="width:100%">
            <option value="none">None</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <br><br>

        <button id="saveSettingsBtn">Save</button>
        <button onclick="document.getElementById('settingsModal').style.display='none'">
            Close
        </button>
    </div>
</div>

<div class="statusbar">
    Float AI running
</div>

<script src="chatManager.js"></script>
<script type="module" src="engineManager.js"></script>
<script src="chatUI.js"></script>
<script src="personality.js"></script>

</body>
</html>
