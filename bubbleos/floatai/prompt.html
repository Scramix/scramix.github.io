<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Float AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Tahoma, Verdana, "Segoe UI Emoji", sans-serif;
    background: linear-gradient(to bottom, #b8ecff, #e8fbff);
    color: #003366;
}

/* Bubble background */
#bubbles {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
}

.bubble {
    position: absolute;
    bottom: -120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.45);
    border: 1px solid rgba(255,255,255,0.7);
    animation: float linear infinite;
}

@keyframes float {
    from { transform: translateY(0); }
    to { transform: translateY(-120vh); }
}

/* fade in */
#wrapper {
    opacity: 0;
    animation: fadein 1.2s forwards;
}

@keyframes fadein {
    to { opacity: 1; }
}

/* header */
.header {
    text-align: center;
    padding: 25px;
}

.logo {
    font-size: 50px;
    font-weight: bold;
    text-shadow: 3px 3px white;
}

.tagline {
    font-size: 14px;
    opacity: 0.8;
}

/* layout */
.container {
    display: flex;
    max-width: 1100px;
    margin: auto;
    gap: 15px;
    padding: 10px;
}

/* panels */
.panel {
    background: rgba(255,255,255,0.75);
    border: 2px solid #7fdfff;
    border-radius: 18px;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.08);
    backdrop-filter: blur(4px);
}

/* sidebar */
#sidebar {
    width: 260px;
    padding: 10px;
    height: 70vh;
    overflow-y: auto;
}

#chatList button {
    width: 100%;
    margin-top: 5px;
    border: 2px solid #6dd6ff;
    background: linear-gradient(#fff, #dff8ff);
    border-radius: 12px;
    padding: 8px;
    cursor: pointer;
}

/* main chat */
#main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 10px;
    height: 70vh;
}

/* chat box */
#chatBox {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    background: rgba(255,255,255,0.5);
    border-radius: 12px;
    border: 1px solid #bfefff;
}

/* messages */
.user {
    text-align: right;
    margin: 6px;
    color: #1a73e8;
}

.assistant {
    text-align: left;
    margin: 6px;
    color: #137333;
}

/* input */
#inputArea {
    display: flex;
    margin-top: 10px;
    gap: 5px;
}

#chatInput {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    border: 2px solid #6dd6ff;
    outline: none;
}

button {
    border-radius: 12px;
    border: 2px solid #6dd6ff;
    background: linear-gradient(#fff, #dff8ff);
    cursor: pointer;
    padding: 10px;
    font-weight: bold;
    transition: transform 0.1s;
}

button:hover {
    transform: scale(1.05);
}

/* status bar */
.statusbar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(to right, #dff8ff, #b8ecff);
    border-top: 2px solid #6dd6ff;
    padding: 6px 12px;
    font-size: 12px;
}

/* footer spacing */
.footer {
    height: 60px;
}
</style>
</head>

<body>

<div id="bubbles"></div>

<div id="wrapper">

    <div class="header">
        <div class="logo">🫧 Float AI</div>
        <div class="tagline">
            A bubbly browser-native AI system.
        </div>
    </div>

    <div class="container">

        <!-- Sidebar -->
        <div id="sidebar" class="panel">
            <button id="newChatBtn">+ New Chat</button>

            <input id="chatSearch"
                   placeholder="Search chats..."
                   style="width:100%; margin-top:10px;">

            <div id="chatList"></div>
        </div>

        <!-- Chat area -->
        <div id="main" class="panel">

            <div id="chatBox"></div>

            <div id="inputArea">
                <input id="chatInput"
                       placeholder="Type a message...">

                <button id="sendBtn">Send</button>
            </div>

        </div>

    </div>

    <div class="footer"></div>

</div>

<div class="statusbar">
    Float AI • Browser-native engine active
</div>

<script>
for (let i = 0; i < 40; i++) {
    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const size = Math.random() * 60 + 15;

    bubble.style.width = size + "px";
    bubble.style.height = size + "px";
    bubble.style.left = Math.random() * 100 + "%";
    bubble.style.animationDuration =
        (Math.random() * 10 + 8) + "s";
    bubble.style.animationDelay =
        Math.random() * 5 + "s";

    document.getElementById("bubbles").appendChild(bubble);
}
</script>

<script src="personality.js"></script>
<script src="chatManager.js"></script>
<script src="engineManager.js"></script>
<script src="chatUI.js"></script>

</body>
</html>
