<!DOCTYPE html>
<html>
<head>
  <title>HARD STOP</title>

  <style>
    body {
      background-color: blue;
      color: white;
      font-family: Consolas, monospace;
      padding: 20px;
    }
  </style>
</head>
<body>

<h1>:(</h1>

<p>
The website scramix.github.io has been terminated due to a hard stop.
Please wait while we are gathering information about the crash...
</p>

<p id="progress">Progress: 0%</p>

<br>

<p>Caused by process: serverhost.exe</p>
<p>Error code: HARD_STOP_32</p>

<script>
let percent = 0;

let loader = setInterval(() => {
  percent++;

  document.getElementById("progress").innerText =
    "Progress: " + percent + "%";

  if (percent >= 100) {
    clearInterval(loader);

    setTimeout(() => {
      window.location.href = "button.html";
    }, 5000);
  }

}, 150);
</script>

</body>
</html>
